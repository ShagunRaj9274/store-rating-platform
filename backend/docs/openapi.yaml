openapi: 3.0.3

info:
  title: Ratebook API
  version: 1.0.0
  description: >
    Store rating platform API. Call POST /auth/login with a demo account,
    copy data.token, click Authorize and paste it.

servers:
  - url: /api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Please fix the highlighted fields
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        address:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - USER
            - OWNER

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - address
                - password
              properties:
                name:
                  type: string
                  minLength: 20
                  maxLength: 60
                  example: Demo User Account For Testing
                email:
                  type: string
                  format: email
                  example: user@example.com
                address:
                  type: string
                  example: Patna, Bihar
                password:
                  type: string
                  format: password
                  example: User@123
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in (any role)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@storerating.com
                password:
                  type: string
                  format: password
                  example: Admin@123
      responses:
        '200':
          description: Logged in; returns user and token
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current logged-in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
        '401':
          description: Authentication required

  /auth/password:
    patch:
      tags:
        - Auth
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required

  /stores:
    get:
      tags:
        - Stores
      summary: List stores for the logged-in user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - name
              - address
              - rating
              - myRating
            default: name
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: address
          schema:
            type: string
      responses:
        '200':
          description: Store list
        '401':
          description: Authentication required

  /stores/{id}/rating:
    put:
      tags:
        - Ratings
      summary: Submit or update your rating for a store
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 4
      responses:
        '201':
          description: Rating created
        '200':
          description: Rating updated
        '400':
          description: Rating must be between 1 and 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
        '403':
          description: Only normal users can rate stores
        '404':
          description: Store not found

  /admin/dashboard:
    get:
      tags:
        - Admin
      summary: Get admin dashboard statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard statistics
        '401':
          description: Authentication required
        '403':
          description: Admin access required

  /admin/users:
    get:
      tags:
        - Admin
      summary: List users
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - name
              - email
              - address
              - role
              - rating
              - createdAt
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: address
          schema:
            type: string
        - in: query
          name: role
          schema:
            type: string
            enum:
              - ADMIN
              - USER
              - OWNER
      responses:
        '200':
          description: User list
        '401':
          description: Authentication required
        '403':
          description: Admin access required

    post:
      tags:
        - Admin
      summary: Create a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - address
                - password
                - role
              properties:
                name:
                  type: string
                  minLength: 20
                  maxLength: 60
                email:
                  type: string
                  format: email
                address:
                  type: string
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum:
                    - ADMIN
                    - USER
                    - OWNER
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
        '401':
          description: Authentication required
        '403':
          description: Admin access required

  /admin/users/{id}:
    get:
      tags:
        - Admin
      summary: Get user details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: User details
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: User not found

  /admin/users/{id}/role:
    patch:
      tags:
        - Admin
      summary: Change user role
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - ADMIN
                    - USER
                    - OWNER
      responses:
        '200':
          description: Role updated
        '400':
          description: Invalid role or attempting to change own role
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: User not found

  /admin/owners/available:
    get:
      tags:
        - Admin
      summary: List available store owners
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available owners
        '401':
          description: Authentication required
        '403':
          description: Admin access required

  /admin/stores:
    get:
      tags:
        - Admin
      summary: List all stores
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - name
              - email
              - address
              - rating
              - ratingCount
              - createdAt
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
        - in: query
          name: address
          schema:
            type: string
      responses:
        '200':
          description: Store list
        '401':
          description: Authentication required
        '403':
          description: Admin access required

    post:
      tags:
        - Admin
      summary: Create a store
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - address
              properties:
                name:
                  type: string
                  minLength: 20
                  maxLength: 60
                email:
                  type: string
                  format: email
                address:
                  type: string
                ownerId:
                  type: integer
                  nullable: true
      responses:
        '201':
          description: Store created
        '400':
          description: Validation error
        '401':
          description: Authentication required
        '403':
          description: Admin access required

  /owner/dashboard:
    get:
      tags:
        - Owner
      summary: Get store owner dashboard
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sortBy
          schema:
            type: string
            enum:
              - name
              - email
              - rating
              - ratedAt
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Owner dashboard
        '401':
          description: Authentication required
        '403':
          description: Owner access required